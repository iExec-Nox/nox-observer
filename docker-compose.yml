services:
  postgres:
    image: postgres:16-alpine
    container_name: nox-observer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nox_user
      POSTGRES_PASSWORD: nox_password
      POSTGRES_DB: nox_observer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nox-observer-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  s3:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: nox-observer-s3
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 15

  # One-shot: creates the bucket on first run, no-op after (--ignore-existing).
  s3-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: nox-observer-s3-init
    restart: "no"
    environment:
      NOX_S3_ACCESS_KEY: minioadmin
      NOX_S3_SECRET_KEY: minioadmin
      NOX_S3_BUCKET: nox-observer
    depends_on:
      s3:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set s3 http://s3:9000 $${NOX_S3_ACCESS_KEY} $${NOX_S3_SECRET_KEY} \
        && mc mb --ignore-existing s3/$${NOX_S3_BUCKET}

  nox-observer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nox-observer
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  pgadmin_data:
  minio_data:

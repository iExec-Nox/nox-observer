services:
  postgres:
    image: postgres:16-alpine
    container_name: nox-observer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nox}
      POSTGRES_DB: ${POSTGRES_DB:-nox_observer}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nox} -d ${POSTGRES_DB:-nox_observer}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

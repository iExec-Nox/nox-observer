query HandlesQuery($first: Int!, $cursorBlock: BigInt!, $cursorId: Bytes!) {
  handles(
    first: $first
    where: {
      or: [
        { blockNumber_gt: $cursorBlock }
        { blockNumber: $cursorBlock, id_gt: $cursorId }
      ]
    }
    orderBy: blockNumber
    orderDirection: asc
  ) {
    id
    operator
    blockNumber
    blockTimestamp
    transactionHash
    parentHandles {
      id
    }
  }
}

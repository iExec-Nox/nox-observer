# Fetch a page of handles using offset-based pagination.
# Ordered by blockTimestamp ascending so we walk the history in creation order.
query HandlesQuery($first: Int!, $skip: Int!) {
  handles(
    first: $first
    skip: $skip
    orderBy: blockTimestamp
    orderDirection: asc
  ) {
    id
    operator
    blockNumber
    blockTimestamp
    transactionHash
    parentHandles {
      id
    }
  }
}

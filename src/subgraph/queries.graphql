query HandlesQuery($first: Int!, $cursorBlock: BigInt!) {
  handles(
    first: $first
    where: { blockNumber_gte: $cursorBlock }
    orderBy: blockNumber
    orderDirection: asc
  ) {
    id
    operator
    blockNumber
    blockTimestamp
    transactionHash
    parentHandles {
      id
    }
  }
}
